<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <header>
            <h1>My Library</h1>
            <button id="new-button" commandfor="new-book-dialog" command="show-modal">
                New book
            </button>
        </header>

        <main id="main">
            <!-- Example code (rendered in javascript)
            <div class="book">
                <h2>Bible</h2>
                <div class="book-element">
                    <p>Author:</p> 
                    <p>God</p>
                </div>
                <div class="book-element">    
                    <p>Number of pages:</p>
                    <p>900</p>
                </div>
                <div class="book-element">
                    <p>Genre:</p>
                    <p>Religion</p>
                </div>
                <button class="remove-button" data-id="<UUID>">
                    X
                </button>
                <button class="read-button" data-id="<UUID">
                    <img src="images/book.svg">
                </button>
            </div>
            -->
        </main>

        <aside>
            <button id="sort-title">Sort by title</button>
            <button id="sort-author">Sort by author</button>
            <button id="example-books">Example books</button>
        </aside>

        <dialog id="new-book-dialog">

            <form id="new-book-form" action="#" method="post">
                <h2>New book form</h2>
                <div class="form-element">
                    <label for="title">Title</label>
                    <input type="text" id="title" />
                </div>
                <div class="form-element">
                    <label for="author">Author</label>
                    <input type="text" id="author" />
                </div>
                <div class="form-element">
                    <label for="pages">Number of pages</label>
                    <input type="number" id="pages" />
                </div>
                <div class="form-element">
                    <label for="genre">Genre</label>
                    <select id="genre">
                        <option value="crime">Crime</option>
                        <option value="fantasy">Fantasy</option>
                        <option value="science-fiction">Science-Fiction</option>
                        <option value="religion">Religion</option>
                        <option value="romance">Romance</option>
                    </select>
                </div>
                <div class="button-section">
                    <button type="submit" id="submit-button">OK</button>
                    <button type="button" commandfor="new-book-dialog" command="close">Close</button>
                </div>
            </form>

        </dialog>

    </div>
    <script src="script.js"></script>
</body>

</html>
